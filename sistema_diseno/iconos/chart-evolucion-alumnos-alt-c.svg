<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa C: Equilibrio Vital - Tríada y Columnas con Gradiente Botánico -->
  <defs>
    <linearGradient id="grad-bar-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#4E9F8E" />
      <stop offset="100%" stopColor="#253B59" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="40" height="40" rx="14" fill="#F7F8FC" stroke="#CED0F2" stroke-width="1.5" />

  <!-- Eje de progresión temporal -->
  <line x1="8" y1="38" x2="40" y2="38" stroke="#253B59" stroke-width="2.5" />

  <!-- Columnas estilizadas con remates cápsula tipo Pilates Roller -->
  <rect x="10" y="27" width="6" height="11" rx="3" fill="#CED0F2" stroke="#253B59" stroke-width="1.75" />
  <rect x="19" y="20" width="6" height="18" rx="3" fill="#4E9F8E" stroke="#253B59" stroke-width="1.75" />
  <rect x="28" y="14" width="6" height="24" rx="3" fill="url(#grad-bar-c)" stroke="#253B59" stroke-width="1.75" />
  <rect x="37" y="9" width="4" height="29" rx="2" fill="#16A34A" />

  <!-- Línea de tendencia fluida superior con indicador de cima -->
  <path d="M12 23c6-3 12-6 25-13" stroke="#16A34A" stroke-width="2.25" stroke-linecap="round" />
  <circle cx="37" cy="10" r="3.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
