<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa A: Geometría Somática - Anillo Concéntrico con Cortes Precisos de 2px -->
  <!-- Anillo exterior dividido en 3 arcos independientes -->
  <!-- Arco 1: Mayoritario en Azul Noche Profundo (50%) -->
