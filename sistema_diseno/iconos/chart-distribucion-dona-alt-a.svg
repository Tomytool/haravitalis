  <!-- Centro hueco de respiración con punto "Hara" central -->
  <circle cx="24" cy="24" r="8" stroke="#253B59" stroke-width="2" stroke-dasharray="2 3" />
  <circle cx="24" cy="24" r="3" fill="#4E9F8E" />
