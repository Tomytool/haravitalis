<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa A: Geometría Somática - Onda Sinusoidal de 7 Días -->
  <!-- Eje base temporal y líneas guía -->
  <line x1="6" y1="38" x2="42" y2="38" stroke="#CED0F2" stroke-width="2" />
  <line x1="6" y1="14" x2="42" y2="14" stroke="#CED0F2" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
  <line x1="6" y1="26" x2="42" y2="26" stroke="#CED0F2" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Curva sinusoidal continua representando la semana de entrenamiento -->
  <path d="M6 34C11 34 13 16 18 16s7 18 12 18 7-20 12-20" stroke="#253B59" stroke-width="2.75" />

  <!-- Puntos nodales de días de alta asistencia -->
  <circle cx="18" cy="16" r="3" fill="#4E9F8E" stroke="#253B59" stroke-width="1.5" />
  <circle cx="30" cy="34" r="2.5" fill="#253B59" />
  <circle cx="42" cy="14" r="3.5" fill="#16A34A" stroke="#253B59" stroke-width="1.5" />

  <!-- 7 Marcas de días en el eje X -->
  <circle cx="6" cy="38" r="1.5" fill="#253B59" />
  <circle cx="12" cy="38" r="1.5" fill="#253B59" />
  <circle cx="18" cy="38" r="1.5" fill="#253B59" />
  <circle cx="24" cy="38" r="1.5" fill="#253B59" />
  <circle cx="30" cy="38" r="1.5" fill="#253B59" />
  <circle cx="36" cy="38" r="1.5" fill="#253B59" />
  <circle cx="42" cy="38" r="1.5" fill="#253B59" />
</svg>
