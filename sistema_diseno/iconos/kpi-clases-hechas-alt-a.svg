<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa A: Geometría Somática - Pure Stroke y Arco de Movimiento -->
  <!-- Órbita de cadencia horaria y ritmo completado -->
  <circle cx="24" cy="24" r="20" stroke="#CED0F2" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Arco activo de movimiento de 270 grados en Azul Noche Profundo -->
  <path d="M24 6a18 18 0 1 1-12.728 5.272" stroke="#253B59" stroke-width="2.75" />
  
  <!-- Nodo de inicio del ejercicio -->
  <circle cx="24" cy="6" r="2.5" fill="#253B59" />

  <!-- Checkmark Somático de Ejercicio Completado (Acento Verde Menta) -->
  <polyline points="16 25 22 31 34 19" stroke="#4E9F8E" stroke-width="3" />
</svg>
