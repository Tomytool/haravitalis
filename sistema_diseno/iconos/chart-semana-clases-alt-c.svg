<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa C: Equilibrio Vital - Doble Curva Suave con Área Degradada -->
  <defs>
    <linearGradient id="grad-semana-c" x1="0" y1="12" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4E9F8E" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#CED0F2" stopOpacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Área bajo la curva de clases llenas -->
  <path d="M6 38 C14 38, 18 20, 24 20 C30 20, 34 30, 42 16 L42 38 L6 38 Z" fill="url(#grad-semana-c)" />

  <!-- Curva 1: Clases totales (Azul Noche Profundo) -->
  <path d="M6 32 C12 32, 16 12, 24 12 C32 12, 34 22, 42 10" stroke="#253B59" stroke-width="2.75" />

  <!-- Curva 2: Clases con cupo 100% completo (Verde Menta) -->
  <path d="M6 38 C14 38, 18 20, 24 20 C30 20, 34 30, 42 16" stroke="#4E9F8E" stroke-width="2.5" />

  <!-- Puntos interactivos destacados de la semana -->
  <circle cx="24" cy="12" r="3.5" fill="#253B59" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="24" cy="20" r="3.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="42" cy="10" r="3" fill="#253B59" />
  <circle cx="42" cy="16" r="3" fill="#16A34A" />

  <!-- Eje base sutil -->
  <line x1="6" y1="38" x2="42" y2="38" stroke="#CED0F2" stroke-width="2" />
</svg>
