<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa B: Silencio Cromático - Balanza Somática de Estabilidad Pélvica -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#CED0F2" fill-opacity="0.3" stroke="#CED0F2" stroke-width="1.5" />

  <!-- Eje central vertical y soporte -->
  <line x1="24" y1="12" x2="24" y2="38" stroke="#253B59" stroke-width="2.5" />
  <path d="M16 38h16" stroke="#253B59" stroke-width="2.5" />
  <circle cx="24" cy="12" r="3" fill="#CED0F2" stroke="#253B59" stroke-width="2" />

  <!-- Viga de equilibrio horizontal en balance perfecto -->
  <line x1="10" y1="18" x2="38" y2="18" stroke="#253B59" stroke-width="2.5" />

  <!-- Platillo izquierdo (Cupos disponibles) -->
  <path d="M10 18l-4 9h8l-4-9z" fill="#CED0F2" fill-opacity="0.5" stroke="#253B59" stroke-width="2" />
  
  <!-- Platillo derecho (Alumnos activos) -->
  <path d="M38 18l-4 9h8l-4-9z" fill="#CED0F2" fill-opacity="0.5" stroke="#253B59" stroke-width="2" />

  <!-- Indicador circular central de nivel óptimo -->
  <circle cx="24" cy="25" r="2.5" fill="#253B59" />
</svg>
