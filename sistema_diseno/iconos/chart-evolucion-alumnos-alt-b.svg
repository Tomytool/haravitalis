<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa B: Silencio Cromático - Tres Bloques de Crecimiento en Duo-Tone -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#CED0F2" fill-opacity="0.3" stroke="#CED0F2" stroke-width="1.5" />

  <!-- Línea base del suelo pélvico -->
  <line x1="8" y1="38" x2="40" y2="38" stroke="#253B59" stroke-width="2.5" />

  <!-- Barra 1 (Lavanda suave con contorno) -->
  <rect x="11" y="26" width="7" height="12" rx="3.5" fill="#CED0F2" stroke="#253B59" stroke-width="2" />

  <!-- Barra 2 (Lavanda con núcleo sólido) -->
  <rect x="21" y="19" width="7" height="19" rx="3.5" fill="#CED0F2" stroke="#253B59" stroke-width="2" />
  <circle cx="24.5" cy="24" r="1.5" fill="#253B59" />

  <!-- Barra 3 (Pico de asistencia / volumen máximo) -->
  <rect x="31" y="11" width="7" height="27" rx="3.5" fill="#253B59" stroke="#253B59" stroke-width="2" />
  <circle cx="34.5" cy="16" r="1.5" fill="#FFFFFF" />

  <!-- Arco de impulso energético sobre las barras -->
  <path d="M12 20c8-6 16-5 24-8" stroke="#253B59" stroke-width="2" stroke-dasharray="2 2" />
</svg>
