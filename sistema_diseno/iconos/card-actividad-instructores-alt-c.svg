<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa C: Equilibrio Vital - Estrella de Maestría y Guía Técnica -->
  <defs>
    <radialGradient id="grad-inst-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#CED0F2" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#4E9F8E" stopOpacity="0.1" />
    </radialGradient>
  </defs>

  <circle cx="24" cy="24" r="20" fill="url(#grad-inst-c)" stroke="#CED0F2" stroke-width="1.5" />

  <!-- Rombo de precisión anatómica (Plano frontal y sagital) -->
  <polygon points="24,8 36,24 24,40 12,24" stroke="#253B59" stroke-width="2" />

  <!-- Instructor / Terapeuta como eje de orientación -->
  <circle cx="24" cy="18" r="4" fill="#253B59" />
  <path d="M18 32c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#253B59" stroke-width="2.5" />

  <!-- 4 Nodos cardinales de maestría (Alineación, Respiración, Control, Precisión) -->
  <circle cx="24" cy="8" r="2.5" fill="#4E9F8E" />
  <circle cx="36" cy="24" r="2.5" fill="#4E9F8E" />
  <circle cx="24" cy="40" r="2.5" fill="#4E9F8E" />
  <circle cx="12" cy="24" r="2.5" fill="#4E9F8E" />

  <!-- Núcleo Hara central -->
  <circle cx="24" cy="26" r="2" fill="#16A34A" />
</svg>
