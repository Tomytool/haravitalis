<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alternativa C: Equilibrio Vital - Tríada y Dinámica de Muelles Reformer -->
  <defs>
    <linearGradient id="grad-ocupacion-c" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#CED0F2" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#4E9F8E" stopOpacity="0.2" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="40" height="40" rx="14" fill="url(#grad-ocupacion-c)" stroke="#4E9F8E" stroke-width="1.5" />

  <!-- 3 Barras / Muelles de calibración con diferentes niveles de carga -->
  <!-- Muelle 1 (Ligero) -->
  <rect x="11" y="26" width="6" height="12" rx="3" fill="#CED0F2" stroke="#253B59" stroke-width="2" />
  
  <!-- Muelle 2 (Medio / Balance óptimo) -->
  <rect x="21" y="16" width="6" height="22" rx="3" fill="#4E9F8E" stroke="#253B59" stroke-width="2" />

  <!-- Muelle 3 (Fuerte / Carga completa) -->
  <rect x="31" y="10" width="6" height="28" rx="3" fill="#253B59" stroke="#253B59" stroke-width="2" />

  <!-- Línea de tensión sagital que conecta las crestas -->
  <path d="M14 26C18 20 25 14 34 10" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="34" cy="10" r="2.5" fill="#16A34A" />
</svg>
